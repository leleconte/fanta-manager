<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Unisciti</title><link rel="stylesheet" href="css/style.css?v=20260814"></head><body><div data-shell><main class="page narrow"><div class="section-head"><div><p class="eyebrow">JOIN LEAGUE</p><h1>Inserisci codice lega</h1><p class="muted">Usa il codice ricevuto dal proprietario della lega.</p></div></div><form id="joinForm" class="panel"><label>Codice lega<input id="joinCode" required placeholder="FANTA-ABC12" autocomplete="off"></label><div id="joinError" class="form-error" aria-live="polite"></div><button class="btn primary" type="submit">UNISCITI</button></form></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/lega.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('joinForm').addEventListener('submit',(e)=>{e.preventDefault();const out=document.getElementById('joinError');out.textContent='';try{const user=requireAuth();if(!user)return;const league=joinLeague(user.id,document.getElementById('joinCode').value.trim());localStorage.setItem('lstore_current_league',league.id);location.href='crea-squadra.html';}catch(err){out.textContent=err.message||'Impossibile entrare nella lega.';}});});</script></body></html>
