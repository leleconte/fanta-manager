<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081222"><title>L-STORE FANTA MANAGER · Registrazione</title><link rel="stylesheet" href="css/style.css?v=20260814b"><link rel="stylesheet" href="css/responsive.css?v=20260814b"><link rel="stylesheet" href="css/login.css?v=20260814"></head><body class="auth-page"><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><main class="auth-card auth-register"><div class="auth-brand"><img src="assets/logo/lstore-logo.png" class="auth-logo" alt="L-Store"><span>L-STORE FANTA MANAGER</span></div><p class="eyebrow">CREATE YOUR TEAM</p><h1>Inizia da qui.</h1><p class="muted">Crea il tuo profilo e preparati all'asta.</p><form id="regForm" novalidate><label>Nome<input id="name" name="name" autocomplete="name" required></label><label>Email<input type="email" id="email" name="email" autocomplete="email" required></label><label>Password<input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required></label><label>Conferma password<input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="6" required></label><div class="password-match" id="matchHint">Inserisci una password di almeno 6 caratteri.</div><div class="form-error" id="error" aria-live="polite"></div><button class="btn primary full" type="submit">CREA PROFILO</button></form><p class="note">Frontend-only: i dati restano nel browser di questo dispositivo.</p><a class="back" href="login.html">← Hai già un account?</a></main><script src="js/storage.js"></script><script src="js/auth.js"></script><script>
const form = document.getElementById('regForm');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirm');
const errorBox = document.getElementById('error');
const matchHint = document.getElementById('matchHint');
function updatePasswordState(){
  const a = passwordInput.value;
  const b = confirmInput.value;
  if(!a && !b){ matchHint.textContent='Inserisci una password di almeno 6 caratteri.'; matchHint.className='password-match'; return; }
  if(b && a === b){ matchHint.textContent='✓ Le password coincidono'; matchHint.className='password-match ok'; return; }
  matchHint.textContent='Le password devono essere identiche.'; matchHint.className='password-match bad';
}
passwordInput.addEventListener('input', updatePasswordState);
confirmInput.addEventListener('input', updatePasswordState);
form.addEventListener('submit', async (event)=>{
  event.preventDefault();
  errorBox.textContent='';
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const password = passwordInput.value;
  const confirm = confirmInput.value;
  if(password !== confirm){
    updatePasswordState();
    confirmInput.focus();
    errorBox.textContent='Le password inserite sono diverse. Controlla i due campi.';
    return;
  }
  try{
    await registerUser(name,email,password,confirm);
    location.href='scelta-lega.html';
  }catch(error){ errorBox.textContent=error.message; }
});
</script></body></html>
