<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Giocatori</title><link rel="stylesheet" href="css/style.css?v=20260814-3"></head><body><div data-shell><main class="page"><div class="section-head"><div><p class="eyebrow">SERIE A DATABASE</p><h1>GIOCATORI</h1></div><button class="btn" data-refresh>AGGIORNA GIOCATORI</button></div><div class="filters panel"><input id="q" placeholder="Cerca giocatore o squadra"><select id="role"><option value="">Tutti i ruoli</option><option value="POR">Portieri</option><option value="DIF">Difensori</option><option value="CEN">Centrocampisti</option><option value="ATT">Attaccanti</option></select><select id="club"><option value="">Tutte le squadre</option></select><select id="status"><option value="all">Tutti</option><option value="available">Disponibili</option><option value="acquired">Acquistati</option></select></div><div id="players" class="player-grid"></div></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/giocatori.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const user=requireAuth();if(!user)return;const qEl=document.getElementById('q'), roleEl=document.getElementById('role'), clubEl=document.getElementById('club'), statusEl=document.getElementById('status'), listEl=document.getElementById('players'), refreshEl=document.querySelector('[data-refresh]');const ps=await loadPlayers();[...new Set(ps.map(p=>p.team))].sort().forEach(c=>clubEl.insertAdjacentHTML('beforeend',`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`));const render=()=>{const out=filterPlayers(ps,{q:qEl.value,role:roleEl.value,club:clubEl.value,status:statusEl.value});listEl.innerHTML=out.map(p=>`<article class="player-card detailed"><div class="avatar">⚽</div><div><strong>${escapeHtml(p.name)}</strong><span>${escapeHtml(p.team)} · ${p.role}</span></div><b class="availability ${p.available?'ok':'off'}">${p.available?'DISPONIBILE':'ACQUISTATO'}</b><small>${p.available?'':'PREZZO: '+(p.price||'—')}</small></article>`).join('')||'<div class="empty">Nessun risultato.</div>'};[qEl,roleEl,clubEl,statusEl].forEach(x=>x.addEventListener('input',render));refreshEl.addEventListener('click',async()=>{await loadPlayers();location.reload();});render();});</script></body></html>
