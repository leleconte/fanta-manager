<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Crea squadra</title><link rel="stylesheet" href="css/style.css?v=20260814"></head><body><div data-shell><main class="page narrow"><div class="section-head"><div><p class="eyebrow">YOUR TEAM</p><h1>Crea la tua squadra</h1><p class="muted">La tua squadra verrà collegata alla lega appena creata.</p></div></div><form id="teamForm" class="panel form-grid"><label>Nome squadra<input id="teamName" required placeholder="Blue Storm"></label><label>Abbreviazione<input id="teamAbbr" maxlength="4" required placeholder="BST"></label><label class="span-2">Logo squadra<input id="teamLogo" type="file" accept="image/*"></label><div class="form-note span-2" id="leagueInfo"></div><div id="teamError" class="form-error span-2" aria-live="polite"></div><button class="btn primary span-2" type="submit">SALVA SQUADRA</button></form></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/squadra.js"></script><script src="js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{
  const user=requireAuth(); if(!user)return;
  const data=loadData();
  const league=data.leagues.find(x=>x.id===localStorage.getItem('lstore_current_league'))||currentLeague(user.id);
  if(!league){location.href='scelta-lega.html';return;}
  document.getElementById('leagueInfo').textContent=`Lega: ${league.name} · ${league.initialCredits} crediti iniziali · Codice ${league.code}`;
  const form=document.getElementById('teamForm');
  form.addEventListener('submit',async(event)=>{
    event.preventDefault(); document.getElementById('teamError').textContent='';
    const name=document.getElementById('teamName').value.trim();
    const abbr=document.getElementById('teamAbbr').value.trim().toUpperCase();
    let logo=''; const file=document.getElementById('teamLogo').files?.[0];
    if(file){logo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=reject;reader.readAsDataURL(file)}).catch(()=>{throw new Error('Impossibile leggere il logo.')});}
    try{createTeam(user.id,league.id,{name,abbr,logo});localStorage.setItem('lstore_current_league',league.id);location.href='dashboard.html';}
    catch(err){document.getElementById('teamError').textContent=err.message||'Impossibile salvare la squadra.';}
  });
});
</script></body></html>
