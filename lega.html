<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Lega</title><link rel="stylesheet" href="css/style.css?v=20260814-3"></head><body><div data-shell><main class="page"><div class="section-head"><div><p class="eyebrow">LEAGUE CONTROL</p><h1 data-name>LEGA</h1><p class="muted">Panoramica della competizione, del timer e delle impostazioni dell’asta.</p></div><button class="btn danger" data-reset>RESETTA DATI ASTA</button></div><div class="info-grid"><div class="panel"><span>CODICE</span><strong data-code>—</strong></div><div class="panel"><span>PROPRIETARIO</span><strong data-owner>—</strong></div><div class="panel"><span>PARTECIPANTI</span><strong data-members>—</strong></div><div class="panel"><span>CREDITI</span><strong data-credits>—</strong></div></div><section class="panel"><div class="section-head"><h2>Impostazioni asta</h2><span data-timer>—</span></div><p class="muted" data-rules>—</p></section></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const u=requireAuth(),l=currentLeague(u.id),d=loadData();document.querySelector('[data-name]').textContent=l.name;document.querySelector('[data-code]').textContent=l.code;document.querySelector('[data-owner]').textContent=d.users.find(x=>x.id===l.ownerId)?.name||'—';document.querySelector('[data-members]').textContent=`${l.members.length}/${l.maxParticipants}`;document.querySelector('[data-credits]').textContent=l.initialCredits;document.querySelector('[data-timer]').textContent=l.timer+' secondi';document.querySelector('[data-rules]').textContent=l.rules;document.querySelector('[data-reset]').onclick=()=>{if(!confirm('Resettare tutte le aste di questa lega?'))return;const d=loadData();d.auctions=d.auctions.filter(a=>a.leagueId!==l.id);d.bids=d.bids.filter(b=>b.leagueId!==l.id);d.rosters=d.rosters.filter(r=>{const t=d.teams.find(x=>x.id===r.teamId);return !t||t.leagueId!==l.id});d.teams.filter(t=>t.leagueId===l.id).forEach(t=>{t.players=[];t.credits=l.initialCredits;t.spent=0});d.players.forEach(p=>p.available=true);saveData(d);location.reload();}});</script></body></html>
