<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Scegli lega</title><link rel="stylesheet" href="css/style.css"></head><body><div data-shell><main class="page narrow"><div class="section-head"><div><p class="eyebrow">WELCOME MANAGER</p><h1>Scegli la tua lega</h1><p class="muted">Crea un ambiente nuovo o entra in una lega esistente.</p></div></div><div class="choice-grid"><a class="choice-card" href="crea-lega.html"><span class="choice-icon">＋</span><h2>CREA UNA LEGA</h2><p>Imposta partecipanti, crediti, timer e regole.</p></a><a class="choice-card" href="unisciti-lega.html"><span class="choice-icon">⌁</span><h2>UNISCITI A UNA LEGA</h2><p>Inserisci il codice e prepara subito la tua squadra.</p></a></div><button class="btn demo" data-demo>AVVIA DEMO COMPLETA</button></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script>document.querySelector('[data-demo]').onclick=async()=>{const u=requireAuth();if(!u)return;const d=loadData();if(!d.leagues.some(l=>l.id==='demo_league')){const players=await (await fetch('data/giocatori.json')).json();d.players=players.map(p=>({...p,available:true}));const l={id:'demo_league',name:'L-Store Demo League',logo:'',code:'DEMO26',maxParticipants:8,initialCredits:500,timer:30,rules:'Asta al rialzo · timer reset al rilancio',ownerId:u.id,members:[u.id],createdAt:Date.now()};d.leagues.push(l);const names=['Blue Storm','L-Store FC','Neon Eleven','Black Wolves'];names.forEach((n,i)=>d.teams.push({id:'demo_team_'+i,leagueId:l.id,ownerId:i===0?u.id:'demo_owner_'+i,name:n,abbr:n.split(' ').map(x=>x[0]).join('').slice(0,3),logo:'',credits:500,spent:0,players:[],createdAt:Date.now()}));for(let i=1;i<4;i++)d.leagues[0].members.push('demo_owner_'+i);d.auctions.push({id:'demo_auc',leagueId:l.id,playerId:d.players[0].id,currentPrice:12,bestTeamId:'demo_team_1',starterTeamId:'demo_team_0',status:'running',endsAt:Date.now()+27000,history:[{teamId:'demo_team_2',amount:5,at:Date.now()-5000},{teamId:'demo_team_1',amount:12,at:Date.now()-2000}],createdAt:Date.now()});saveData(d);}location.href='dashboard.html'};</script></body></html>
