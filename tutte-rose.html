<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Tutte Rose</title><link rel="stylesheet" href="css/style.css"></head><body><div data-shell><main class="page"><div class="section-head"><div><p class="eyebrow">LEAGUE OVERVIEW</p><h1>TUTTE LE ROSE</h1></div></div><div id="teams" class="team-cards"></div></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const u=requireAuth(),l=currentLeague(u.id),d=loadData();const ts=d.teams.filter(t=>t.leagueId===l.id);teams.innerHTML=ts.map(t=>`<article class="team-card"><div class="team-mark large">${t.abbr}</div><div><h2>${escapeHtml(t.name)}</h2><p>Proprietario: ${escapeHtml(d.users.find(x=>x.id===t.ownerId)?.name||'—')}</p></div><div class="team-stats"><strong>${t.credits}</strong><span>CR</span><small>${t.players.length} giocatori</small></div></article>`).join('')});</script></body></html>
