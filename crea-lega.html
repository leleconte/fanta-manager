<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Crea lega</title><link rel="stylesheet" href="css/style.css"></head><body><div data-shell><main class="page narrow"><div class="section-head"><div><p class="eyebrow">NUOVA COMPETIZIONE</p><h1>Crea una lega</h1></div></div><form id="form" class="panel form-grid"><label>Nome lega<input id="name" required placeholder="L-Store Champions"></label><label>Logo lega<input id="logo" type="file" accept="image/*"></label><label>Partecipanti max<input id="max" type="number" min="2" value="8"></label><label>Crediti iniziali<input id="credits" type="number" min="50" value="500"></label><label>Durata timer asta<select id="timer"><option>10</option><option>20</option><option selected>30</option><option>45</option><option>60</option></select></label><label class="span-2">Regole base<textarea id="rules">Asta al rialzo. Ogni rilancio resetta il timer.</textarea></label><div id="error" class="form-error span-2"></div><button class="btn primary span-2">CREA LEGA</button></form></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/lega.js"></script><script src="js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const u=requireAuth();let img='';if(logo.files[0])img=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(logo.files[0])});try{const l=createLeague(u.id,{name:name.value,logo:img,maxParticipants:max.value,credits:credits.value,timer:timer.value,rules:rules.value});localStorage.setItem('lstore_current_league',l.id);location.href='crea-squadra.html'}catch(x){error.textContent=x.message}};</script></body></html>
