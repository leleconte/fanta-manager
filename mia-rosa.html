<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Mia Rosa</title><link rel="stylesheet" href="css/style.css?v=20260814"></head><body><div data-shell><main class="page"><div class="section-head"><div><p class="eyebrow">MY TEAM</p><h1>MIA ROSA</h1></div></div><div id="roster"></div></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const u=requireAuth();const l=currentLeague(u.id);const d=loadData(),t=currentTeam(u.id,l.id),ps=d.players.filter(p=>t.players.includes(p.id));const roles={POR:'PORTIERI',DIF:'DIFENSORI',CEN:'CENTROCAMPISTI',ATT:'ATTACCANTI'};roster.innerHTML=Object.entries(roles).map(([r,n])=>`<section class="panel roster-section"><div class="section-head"><h2>${n}</h2><span>${ps.filter(p=>p.role===r).length}</span></div><div class="player-grid">${ps.filter(p=>p.role===r).map(p=>`<article class="player-card"><div class="avatar">⚽</div><div><strong>${escapeHtml(p.name)}</strong><span>${escapeHtml(p.team)}</span></div><b>${p.price} CR</b></article>`).join('')||'<div class="empty">Vuoto</div>'}</div></section>`).join('')});</script></body></html>
