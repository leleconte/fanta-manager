<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Giocatori</title><link rel="stylesheet" href="css/style.css"></head><body><div data-shell><main class="page"><div class="section-head"><div><p class="eyebrow">SERIE A DATABASE</p><h1>GIOCATORI</h1></div><button class="btn" data-refresh>AGGIORNA GIOCATORI</button></div><div class="filters panel"><input id="q" placeholder="Cerca giocatore o squadra"><select id="role"><option value="">Tutti i ruoli</option><option value="POR">Portieri</option><option value="DIF">Difensori</option><option value="CEN">Centrocampisti</option><option value="ATT">Attaccanti</option></select><select id="club"><option value="">Tutte le squadre</option></select><select id="status"><option value="all">Tutti</option><option value="available">Disponibili</option><option value="acquired">Acquistati</option></select></div><div id="players" class="player-grid"></div></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/giocatori.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{requireAuth();const ps=await loadPlayers();[...new Set(ps.map(p=>p.team))].sort().forEach(c=>club.insertAdjacentHTML('beforeend',`<option>${escapeHtml(c)}</option>`));const render=()=>{const out=filterPlayers(ps,{q:q.value,role:role.value,club:club.value,status:status.value});players.innerHTML=out.map(p=>`<article class="player-card detailed"><div class="avatar">⚽</div><div><strong>${escapeHtml(p.name)}</strong><span>${escapeHtml(p.team)} · ${p.role}</span></div><b class="availability ${p.available?'ok':'off'}">${p.available?'DISPONIBILE':'ACQUISTATO'}</b><small>${p.available?'':'PREZZO: '+(p.price||'—')}</small></article>`).join('')||'<div class="empty">Nessun risultato.</div>'};[q,role,club,status].forEach(x=>x.oninput=render);dataRefreshHandler=()=>loadPlayers().then(render);document.querySelector('[data-refresh]').onclick=dataRefreshHandler;render();});</script></body></html>
