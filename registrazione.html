<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Registrazione</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><main class="auth-card"><img src="assets/logo/lstore-logo.png" class="auth-logo" alt="L-Store"><h1>Crea il tuo profilo</h1><form id="regForm"><label>Nome<input id="name" required></label><label>Email<input type="email" id="email" required></label><label>Password<input type="password" id="password" required></label><label>Conferma password<input type="password" id="confirm" required></label><div class="form-error" id="error"></div><button class="btn primary full">REGISTRATI</button></form><p class="note">La password viene hashata localmente quando supportato dal browser.</p><a class="back" href="login.html">← Hai già un account?</a></main><script src="js/storage.js"></script><script src="js/auth.js"></script><script>regForm.onsubmit=async e=>{e.preventDefault();try{await registerUser(name.value,email.value,password.value,confirm.value);location.href='scelta-lega.html'}catch(x){error.textContent=x.message}};</script></body></html>
