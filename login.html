<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Login</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><main class="auth-card"><img src="assets/logo/lstore-logo.png" class="auth-logo" alt="L-Store"><h1>Accedi</h1><p class="muted">Il tuo manager, sempre nel browser.</p><form id="loginForm"><label>Email<input type="email" id="email" required></label><label>Password<input type="password" id="password" required></label><div class="form-error" id="error"></div><button class="btn primary full">ACCEDI</button><button type="button" class="link-btn" data-forgot>PASSWORD DIMENTICATA</button></form><div class="auth-divider"></div><a class="btn ghost full" href="registrazione.html">REGISTRATI</a><a class="back" href="iniziale.html">← Torna alla home</a><p class="note">Frontend-only: il login è locale e non è un sistema di autenticazione sicuro.</p></main><script src="js/storage.js"></script><script src="js/auth.js"></script><script>if(new URLSearchParams(location.search).get('demo')==='1' || localStorage.getItem('lstore_demo_pending')==='1'){(async()=>{const d=loadData();let u=d.users.find(x=>x.id==='demo_user');if(!u){u={id:'demo_user',name:'Demo Manager',email:'demo@lstore.local',passwordHash:await hashPassword('demo1234'),avatar:''};d.users.push(u);saveData(d)}localStorage.removeItem('lstore_demo_pending');setSession({userId:u.id});location.href='scelta-lega.html'})()}</script><script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const er=document.getElementById('error');try{await loginUser(email.value,password.value);location.href='scelta-lega.html'}catch(x){if(localStorage.getItem('lstore_demo_pending')==='1'){localStorage.removeItem('lstore_demo_pending');location.href='scelta-lega.html'}else er.textContent=x.message}};document.querySelector('[data-forgot]').onclick=()=>alert('Nessun backend disponibile: per sicurezza questa demo non può inviare email di recupero. Puoi registrare un nuovo account.');</script></body></html>
