<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Crea squadra</title><link rel="stylesheet" href="css/style.css"></head><body><div data-shell><main class="page narrow"><div class="section-head"><div><p class="eyebrow">YOUR TEAM</p><h1>Crea la tua squadra</h1></div></div><form id="form" class="panel form-grid"><label>Nome squadra<input id="name" required placeholder="Blue Storm"></label><label>Abbreviazione<input id="abbr" maxlength="4" required placeholder="BST"></label><label class="span-2">Logo squadra<input id="logo" type="file" accept="image/*"></label><div class="form-note span-2" id="leagueInfo"></div><div id="error" class="form-error span-2"></div><button class="btn primary span-2">SALVA SQUADRA</button></form></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/squadra.js"></script><script src="js/app.js"></script><script>const u=requireAuth();const d=loadData();const l=d.leagues.find(x=>x.id===localStorage.getItem('lstore_current_league'))||currentLeague(u.id);if(!l)location.href='scelta-lega.html';leagueInfo.textContent=`Lega: ${l.name} · ${l.initialCredits} crediti iniziali`;form.onsubmit=async e=>{e.preventDefault();let img='';if(logo.files[0])img=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(logo.files[0])});try{createTeam(u.id,l.id,{name:name.value,abbr:abbr.value.toUpperCase(),logo:img});localStorage.setItem('lstore_current_league',l.id);location.href='dashboard.html'}catch(x){error.textContent=x.message}};</script></body></html>
