<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L-STORE FANTA MANAGER · Crea lega</title>
<link rel="stylesheet" href="css/style.css?v=20260814b"><link rel="stylesheet" href="css/responsive.css?v=20260814b">
</head>
<body>
<div data-shell><main class="page narrow">
  <div class="section-head"><div>
    <p class="eyebrow">NUOVA COMPETIZIONE</p><h1>Crea una lega</h1>
    <p class="muted">Configura la tua asta e genera subito il codice della lega.</p>
  </div></div>
  <form id="leagueForm" class="panel form-grid" novalidate>
    <label>Nome lega<input id="leagueName" name="leagueName" required placeholder="L-Store Champions"></label>
    <label>Logo lega<input id="leagueLogo" name="leagueLogo" type="file" accept="image/*"></label>
    <label>Partecipanti max<input id="leagueMax" name="leagueMax" type="number" min="2" max="32" value="8" required></label>
    <label>Crediti iniziali<input id="leagueCredits" name="leagueCredits" type="number" min="50" value="500" required></label>
    <label>Durata timer asta<select id="leagueTimer" name="leagueTimer"><option value="10">10 secondi</option><option value="20">20 secondi</option><option value="30" selected>30 secondi</option><option value="45">45 secondi</option><option value="60">60 secondi</option></select></label>
    <label class="span-2">Regole base<textarea id="leagueRules" name="leagueRules">Asta al rialzo. Ogni rilancio resetta il timer.</textarea></label>
    <div class="form-note span-2">Tutti i dati restano nel browser. Nessun server o database esterno.</div>
    <div id="leagueError" class="form-error span-2" aria-live="polite"></div>
    <button id="createLeagueBtn" class="btn primary span-2" type="submit">CREA LEGA</button>
  </form>
</main></div>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/lega.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const form=document.getElementById('leagueForm');
  const errorBox=document.getElementById('leagueError');
  const button=document.getElementById('createLeagueBtn');
  const user=requireAuth();
  if(!user) return;
  form.addEventListener('submit', async function(event){
    event.preventDefault();
    errorBox.textContent='';
    errorBox.className='form-error span-2';
    button.disabled=true;
    button.textContent='CREAZIONE...';
    try{
      const name=document.getElementById('leagueName').value.trim();
      const max=document.getElementById('leagueMax').value;
      const credits=document.getElementById('leagueCredits').value;
      const timer=document.getElementById('leagueTimer').value;
      const rules=document.getElementById('leagueRules').value.trim();
      let logo='';
      const file=document.getElementById('leagueLogo').files && document.getElementById('leagueLogo').files[0];
      if(file){
        if(file.size>2*1024*1024) throw new Error('Il logo deve essere più piccolo di 2 MB.');
        logo=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(String(reader.result||''));
          reader.onerror=()=>reject(new Error('Impossibile leggere il logo.'));
          reader.readAsDataURL(file);
        });
      }
      const league=createLeague(user.id,{name,logo,maxParticipants:max,credits,timer,rules});
      localStorage.setItem('lstore_current_league',league.id);
      location.href='crea-squadra.html';
    }catch(err){
      errorBox.textContent=err && err.message ? err.message : 'Impossibile creare la lega.';
      errorBox.className='form-error span-2 bad';
      button.disabled=false;
      button.textContent='CREA LEGA';
    }
  });
});
</script>
</body></html>
