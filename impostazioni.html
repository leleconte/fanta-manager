<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-STORE FANTA MANAGER · Impostazioni</title><link rel="stylesheet" href="css/style.css?v=20260814"></head><body><div data-shell><main class="page narrow"><div class="section-head"><div><p class="eyebrow">SYSTEM</p><h1>IMPOSTAZIONI</h1></div></div><section class="panel form-grid"><label>Nome profilo<input id="pname"></label><label>Email<input id="pemail" disabled></label><label>Nome squadra<input id="tname"></label><label>Tema<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><div class="span-2 actions-row"><button class="btn primary" id="save">SALVA MODIFICHE</button><a class="btn" href="modalita-tv.html">MODALITÀ TV</a><button class="btn danger" id="reset">ELIMINA DATI LOCALI</button><button class="btn" id="logout">LOGOUT</button></div></section><p class="note">Attenzione: eliminare i dati locali cancella account, leghe, rose, aste e configurazioni di questo browser.</p></main></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const u=requireAuth(),d=loadData(),l=currentLeague(u.id),t=l?currentTeam(u.id,l.id):null;pname.value=u.name;pemail.value=u.email;tname.value=t?.name||'';theme.value=d.settings?.theme||'dark';save.onclick=()=>{const d=loadData();const uu=d.users.find(x=>x.id===u.id);uu.name=pname.value;if(t){const tt=d.teams.find(x=>x.id===t.id);tt.name=tname.value}d.settings.theme=theme.value;saveData(d);alert('Impostazioni salvate.');location.reload()};logout.onclick=()=>window.logout();reset.onclick=()=>{if(confirm('Eliminare DEFINITIVAMENTE tutti i dati locali?')){localStorage.clear();location.href='iniziale.html'}}});</script></body></html>
