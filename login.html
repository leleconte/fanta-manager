<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081222"><title>L-STORE FANTA MANAGER · Login</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css"></head><body class="auth-page"><div class="ambient ambient-a"></div><div class="ambient ambient-c"></div><main class="auth-card"><div class="auth-brand"><img src="assets/logo/lstore-logo.png" class="auth-logo" alt="L-Store"><span>L-STORE FANTA MANAGER</span></div><p class="eyebrow">WELCOME BACK</p><h1>Bentornato.</h1><p class="muted">Rientra nella tua lega e continua l'asta.</p><form id="loginForm" novalidate><label>Email<input type="email" id="email" name="email" autocomplete="email" required></label><label>Password<input type="password" id="password" name="password" autocomplete="current-password" required></label><div class="form-error" id="error" aria-live="polite"></div><button class="btn primary full" type="submit">ACCEDI</button><button type="button" class="link-btn" data-forgot>PASSWORD DIMENTICATA</button></form><div class="auth-divider"></div><a class="btn ghost full" href="registrazione.html">CREA UN ACCOUNT</a><a class="back" href="iniziale.html">← Torna alla home</a><p class="note">Frontend-only: il login è locale e non sostituisce un servizio di autenticazione online.</p></main><script src="js/storage.js"></script><script src="js/auth.js"></script><script>
document.getElementById('loginForm').addEventListener('submit', async (event)=>{
  event.preventDefault();
  const errorBox = document.getElementById('error');
  errorBox.textContent='';
  try{
    await loginUser(document.getElementById('email').value, document.getElementById('password').value);
    location.href='scelta-lega.html';
  }catch(error){ errorBox.textContent=error.message; }
});
document.querySelector('[data-forgot]').addEventListener('click',()=>alert('Nessun backend disponibile: il recupero password via email non è previsto nella versione frontend-only.'));
</script></body></html>
